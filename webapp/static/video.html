<!DOCTYPE html>
<html lang="zh-CN" data-deployment-role="__DEPLOYMENT_ROLE__">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="admin-workspace-user-id" content="__ADMIN_WORKSPACE_USER_ID__" />
  <meta name="admin-console-session" content="__ADMIN_CONSOLE_SESSION__" />
  <meta name="deployment-role" content="__DEPLOYMENT_ROLE__" />
  <title>视频工作台 · Vecto</title>
  <link rel="icon" type="image/png" href="/assets/opc/vecto-logo-ui-icon.png?v=20260711" />
  <link rel="stylesheet" href="/assets/style.css?v=__STYLE_VERSION__" />
  <link rel="stylesheet" href="/assets/opc/site-navigation.css?v=__SITE_NAVIGATION_CSS_VERSION__" />
  <link rel="stylesheet" href="/assets/console.css?v=__CONSOLE_CSS_VERSION__" />
  <link rel="stylesheet" href="/assets/video-workbench.css?v=__VIDEO_WORKBENCH_CSS_VERSION__" />
  <script defer src="/assets/opc/site-navigation.js?v=__SITE_NAVIGATION_JS_VERSION__"></script>
</head>
<body class="console-page video-page" data-login-redirect="/video.html">
  <a class="site-skip-link" href="#main-content" data-site-copy="skip">跳至主要内容</a>
  <header class="site-header" data-header data-site-header data-site-page="video" data-site-mode="public" data-site-auth-state="pending" data-site-variant="solid" data-i18n-skip="true">
    <a class="brand" href="/" aria-label="Vecto 首页" data-site-home-label>
      <span class="brand-logo-frame" aria-hidden="true"><img class="brand-logo" src="/assets/opc/vecto-logo-ui-icon.png?v=20260711" alt="" width="1024" height="1024" /></span>
      <span class="brand-text"><span class="brand-name">Vecto</span><span class="brand-local" data-site-copy="brandLocal">维拓</span></span>
    </a>
    <div class="header-actions">
      <a class="site-icon-button site-subscription-link" href="/subscription.html" data-site-subscription-entry aria-label="订阅方案" title="订阅方案">
        <svg class="site-subscription-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 16.5z"></path><path d="M4 9h16M8 14h3"></path><path d="m17.5 12.5.7 1.4 1.6.2-1.2 1.1 0.3 1.6-1.4-.8-1.4.8.3-1.6-1.2-1.1 1.6-.2z"></path></svg>
      </a>
      <button id="openAdmin" type="button" class="site-admin-entry admin-only" data-site-admin-entry data-site-copy="adminConsole" hidden>运营后台</button>
      <div class="site-global-controls" aria-label="全局显示设置" data-site-global-controls>
        <button id="languageToggle" class="site-icon-button site-language-button" type="button" aria-label="切换到繁体中文" aria-pressed="false" data-site-language-toggle>
          <svg class="site-language-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.4 2.5 3.6 5.5 3.6 9S14.4 18.5 12 21M12 3C9.6 5.5 8.4 8.5 8.4 12s1.2 6.5 3.6 9"></path></svg><span class="site-language-state" data-site-language-state>简</span>
        </button>
      </div>
      <button class="header-login" type="button" data-open-login><span data-site-copy="login">登录</span></button>
    </div>
  </header>

  <div class="console-shell">
    <aside id="consoleSidebar" class="console-sidebar">
      <div class="console-brand">
        <div class="brand-mark"><img src="/assets/opc/vecto-logo-ui-icon.png?v=20260711" alt="" width="32" height="32" /></div>
        <div>
          <h1>视频工作台</h1>
          <p>Vecto OS 视频与图片素材</p>
        </div>
        <button id="mobileNavClose" class="mobile-nav-close" type="button" aria-label="关闭导航">×</button>
      </div>
      <nav class="console-nav" aria-label="视频工作台导航">
        <button type="button" class="is-active nav-parent-toggle" data-view="video_workspace" aria-expanded="true">
          <span>视频工作台</span>
          <span class="nav-toggle-arrow" aria-hidden="true"></span>
        </button>
        <div class="sidebar-flow video-workspace-flow is-open" id="videoWorkspaceFlow">
          <div class="sidebar-flow-divider" aria-hidden="true"></div>
          <div class="module-menu video-module-menu" id="videoModuleMenu" aria-label="视频工作台模块"></div>
        </div>
      </nav>
      <div class="sidebar-bottom-actions"></div>
    </aside>

    <button id="consoleNavBackdrop" class="console-nav-backdrop" type="button" aria-label="关闭导航" tabindex="-1" hidden></button>

    <div id="mobilePageToolbar" class="mobile-page-toolbar" aria-label="当前页面导航">
      <button id="mobileNavToggle" class="mobile-nav-toggle" type="button" aria-label="打开视频工作台导航" title="打开视频工作台导航" aria-controls="consoleSidebar" aria-expanded="false">
        <svg class="mobile-nav-toggle-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <rect x="3" y="3" width="18" height="18" rx="2"></rect>
          <path d="M9 3v18"></path>
        </svg>
      </button>
      <button id="mobileVideoWorkspaceButton" class="mobile-video-workspace-button" type="button" data-view="video_workspace" hidden aria-label="视频" title="视频"></button>
      <div class="mobile-page-toolbar-title" aria-live="polite">
        <strong id="mobilePageToolbarTitle">视频工作台</strong>
      </div>
    </div>

    <main id="main-content" class="console-main" tabindex="-1">
      <h2 id="viewTitle" class="sr-only">视频工作台</h2>
      <div id="adminWorkspaceBanner" class="admin-workspace-banner" hidden>
        <div>
          <strong>管理员工作区</strong>
          <span>正在管理 <b id="adminWorkspaceUsername">-</b> 的账号数据，所有操作都会记录。</span>
        </div>
        <a href="/admin.html#admin-users">返回账号管理</a>
      </div>
      <section class="view video-workbench-view is-active" data-panel="video_workspace" aria-labelledby="viewTitle">
        <div id="videoWorkbenchRoot" class="video-workbench-root" aria-live="polite">
          <div class="video-workbench-state video-workbench-state--loading" role="status">
            <span class="video-workbench-loader" aria-hidden="true"></span>
            <strong>正在准备视频工作台</strong>
            <span>读取可用模块与任务规划...</span>
          </div>
        </div>
      </section>
    </main>
  </div>

  <nav id="mobileTaskDock" class="mobile-task-dock" aria-label="任务快捷导航" hidden></nav>
  <script src="/assets/video-workbench.js?v=__VIDEO_WORKBENCH_JS_VERSION__"></script>
  <script src="/assets/video-page.js?v=__VIDEO_PAGE_JS_VERSION__"></script>
</body>
</html>
