<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-labelledby="title desc">
  <title id="title">关键词焦点字幕模板</title>
  <desc id="desc">宽幅半透明顶栏和绿色关键词焦点字幕</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b3c5bd"/><stop offset=".5" stop-color="#d9bd9e"/><stop offset="1" stop-color="#5c6f72"/></linearGradient>
    <linearGradient id="veil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".05"/><stop offset="1" stop-color="#1d3532" stop-opacity=".56"/></linearGradient>
  </defs>
  <rect width="240" height="360" fill="url(#bg)"/>
  <circle cx="42" cy="95" r="55" fill="#f4ead7" opacity=".28"/>
  <circle cx="196" cy="146" r="72" fill="#f7e9cf" opacity=".2"/>
  <rect x="12" y="26" width="216" height="148" rx="7" fill="#28302f" opacity=".3"/>
  <text x="120" y="66" text-anchor="middle" fill="#f8fff9" font-family="Noto Sans CJK SC, sans-serif" font-size="11" font-weight="800">日常补充的新选择</text>
  <text x="120" y="111" text-anchor="middle" fill="#fff" font-family="Noto Sans CJK SC, sans-serif" font-size="20" font-weight="900">每天一粒</text>
  <text x="120" y="145" text-anchor="middle" fill="#2de88b" stroke="#112a20" stroke-width="1" paint-order="stroke" font-family="Noto Sans CJK SC, sans-serif" font-size="22" font-weight="900">轻松坚持</text>
  <rect x="22" y="223" width="196" height="52" rx="9" fill="#102b2d" opacity=".55"/>
  <text x="120" y="256" text-anchor="middle" fill="#2de88b" stroke="#112a20" stroke-width="1" paint-order="stroke" font-family="Noto Sans CJK SC, sans-serif" font-size="19" font-weight="900">高纯度鱼油</text>
  <rect width="240" height="360" fill="url(#veil)"/>
  <text x="120" y="319" text-anchor="middle" fill="#f4fff8" stroke="#10281f" stroke-width="1.3" paint-order="stroke" font-family="Noto Sans CJK SC, sans-serif" font-size="14" font-weight="900">关键字突出显示</text>
</svg>
