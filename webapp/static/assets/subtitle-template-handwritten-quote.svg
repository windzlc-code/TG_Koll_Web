<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 360" role="img" aria-labelledby="title desc">
  <title id="title">手写金句字幕模板</title>
  <desc id="desc">深色顶栏搭配金色标签和手写风格金句</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a98e79"/><stop offset=".55" stop-color="#57463e"/><stop offset="1" stop-color="#201817"/></linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" stop-color="#1c1310" stop-opacity=".08"/><stop offset="1" stop-color="#1c1310" stop-opacity=".78"/></linearGradient>
  </defs>
  <rect width="240" height="360" fill="url(#bg)"/>
  <rect x="20" y="30" width="200" height="140" rx="5" fill="#18120f" opacity=".72" stroke="#2a201a"/>
  <rect x="28" y="43" width="155" height="17" fill="#f6d060" opacity=".72"/>
  <text x="30" y="58" fill="#2a1a0d" font-family="Noto Sans CJK SC, sans-serif" font-size="9" font-weight="800">今日状态提醒</text>
  <text x="30" y="102" fill="#ffd34d" font-family="cursive, Noto Sans CJK SC, sans-serif" font-size="20" font-weight="900" transform="rotate(-3 30 102)">好状态</text>
  <text x="30" y="133" fill="#ffd34d" font-family="cursive, Noto Sans CJK SC, sans-serif" font-size="18" font-weight="900" transform="rotate(-3 30 133)">从每天开始</text>
  <path d="M31 148c42 8 92 8 155-2" fill="none" stroke="#ffd34d" stroke-width="2" stroke-linecap="round"/>
  <rect width="240" height="360" fill="url(#shade)"/>
  <text x="120" y="314" text-anchor="middle" fill="#fff8ec" stroke="#2a1e17" stroke-width="1.4" paint-order="stroke" font-family="cursive, Noto Sans CJK SC, sans-serif" font-size="15" font-weight="900">一粒刚刚好</text>
</svg>
