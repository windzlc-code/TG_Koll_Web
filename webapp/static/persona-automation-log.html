<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>自动化任务日志</title>
  <link rel="stylesheet" href="/assets/style.css" />
  <style>
    body { background: #f6f8fb; color: #101828; }
    .log-shell { max-width: 1180px; margin: 0 auto; padding: 24px; }
    .log-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 16px; }
    .log-title h1 { margin: 0 0 6px; font-size: 22px; }
    .log-title p { margin: 0; color: #667085; }
    .log-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .log-grid { display: grid; grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr); gap: 16px; }
    .log-panel { background: #fff; border: 1px solid #d9e2ef; border-radius: 8px; padding: 16px; }
    .log-panel h2 { margin: 0 0 12px; font-size: 16px; }
    .log-meta { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 8px 12px; font-size: 14px; }
    .log-meta span { color: #667085; }
    .log-pre { white-space: pre-wrap; word-break: break-word; background: #f8fafc; border: 1px solid #e4eaf3; border-radius: 6px; padding: 12px; max-height: 320px; overflow: auto; font-size: 13px; }
    .log-list { display: flex; flex-direction: column; gap: 10px; max-height: 620px; overflow: auto; }
    .log-item { border: 1px solid #e4eaf3; border-radius: 8px; padding: 12px; background: #fff; }
    .log-item-top { display: flex; justify-content: space-between; gap: 12px; color: #667085; font-size: 12px; margin-bottom: 6px; }
    .log-message { white-space: pre-wrap; word-break: break-word; }
    .log-media { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    .log-media a { display: block; border: 1px solid #d9e2ef; border-radius: 8px; padding: 10px; background: #fff; color: #172b4d; text-decoration: none; word-break: break-all; }
    .log-media img { width: 100%; max-height: 260px; object-fit: contain; border-radius: 6px; background: #f8fafc; }
    .log-status { display: inline-flex; align-items: center; padding: 3px 8px; border-radius: 999px; background: #eaf2ff; color: #175cd3; font-weight: 700; font-size: 12px; }
    .log-status.failed, .log-status.need_manual { background: #ffe4e8; color: #b42318; }
    .log-status.success, .log-status.ready { background: #dcfae6; color: #067647; }
    @media (max-width: 900px) { .log-grid { grid-template-columns: 1fr; } .log-shell { padding: 14px; } }
    @media (max-width: 560px) {
      body { min-height: 100dvh; overflow-x: hidden; }
      .log-shell {
        width: 100%;
        min-width: 0;
        padding:
          max(12px, env(safe-area-inset-top))
          max(12px, env(safe-area-inset-right))
          max(16px, env(safe-area-inset-bottom))
          max(12px, env(safe-area-inset-left));
      }
      .log-head { flex-direction: column; align-items: stretch; }
      .log-title, .log-panel, .log-item, .log-pre { min-width: 0; max-width: 100%; }
      .log-title h1 { font-size: 20px; overflow-wrap: anywhere; }
      .log-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .log-actions > a, .log-actions > button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        min-height: 44px;
        padding: 9px 10px;
        text-align: center;
        white-space: normal;
      }
      .log-grid { gap: 12px; }
      .log-panel { padding: 12px; }
      .log-meta { grid-template-columns: 1fr; gap: 3px; }
      .log-meta strong { margin-bottom: 8px; overflow-wrap: anywhere; }
      .log-list { max-height: none; overflow: visible; }
      .log-item-top { flex-direction: column; gap: 3px; }
      .log-media { grid-template-columns: 1fr; }
      .log-pre { overscroll-behavior: contain; }
    }
    @media (max-width: 360px) {
      .log-actions { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main class="log-shell">
    <div class="log-head">
      <div class="log-title">
        <h1 data-log-i18n="pageTitle">自动化任务日志</h1>
        <p id="logSubtitle" data-log-i18n="loading">正在加载...</p>
      </div>
      <div class="log-actions">
        <a id="returnConsole" class="btn ghost" href="/console.html" data-log-i18n="openConsole">进入 Web 控制台</a>
        <button class="ghost" type="button" id="refreshBtn" data-log-i18n="refresh">刷新</button>
        <button class="ghost" type="button" id="toggleAutoBtn" data-log-i18n="pauseAuto">暂停自动刷新</button>
        <button class="ghost" type="button" onclick="window.close()" data-log-i18n="closeWindow">关闭窗口</button>
      </div>
    </div>
    <div class="log-grid">
      <section class="log-panel">
        <h2 data-log-i18n="taskInfo">任务信息</h2>
        <div class="log-meta" id="taskMeta"></div>
        <h2 style="margin-top:18px" data-log-i18n="contentParams">内容 / 参数</h2>
        <div class="log-pre" id="payloadBox">-</div>
        <h2 style="margin-top:18px" data-log-i18n="mediaScreenshots">媒体 / 截图</h2>
        <div class="log-media" id="mediaBox"></div>
      </section>
      <section class="log-panel">
        <h2 data-log-i18n="executionLogs">执行日志</h2>
        <div class="log-list" id="logList"></div>
      </section>
    </div>
  </main>
  <script>
    const LOG_LANGUAGE_STORAGE_KEY = "wk-console-language";
    const LOG_COPY = {
      "zh-Hans": {
        documentTitle: "自动化任务日志", pageTitle: "自动化任务日志", loading: "正在加载...", openConsole: "进入 Web 控制台",
        refresh: "刷新", pauseAuto: "暂停自动刷新", resumeAuto: "继续自动刷新", closeWindow: "关闭窗口",
        taskInfo: "任务信息", contentParams: "内容 / 参数", mediaScreenshots: "媒体 / 截图", executionLogs: "执行日志",
        requestStatus: (status) => `接口状态 ${status}`, taskMedia: (index) => `任务媒体 ${index}`,
        resultScreenshot: (index) => `结果截图 ${index}`, stageScreenshot: (stage) => `${stage} 截图`, noMedia: "暂无媒体或截图",
        taskId: "任务ID", platform: "平台", task: "任务", status: "状态", accountId: "账号ID", personaId: "人设ID",
        createdAt: "创建时间", updatedAt: "更新时间", startedAt: "开始时间", finishedAt: "结束时间", error: "错误",
        openScreenshot: "打开截图", noLogs: "暂无日志", missingTaskId: "缺少 task_id",
      },
      "zh-Hant": {
        documentTitle: "自動化任務日誌", pageTitle: "自動化任務日誌", loading: "正在載入...", openConsole: "進入 Web 控制台",
        refresh: "重新整理", pauseAuto: "暫停自動重新整理", resumeAuto: "繼續自動重新整理", closeWindow: "關閉視窗",
        taskInfo: "任務資訊", contentParams: "內容 / 參數", mediaScreenshots: "媒體 / 截圖", executionLogs: "執行日誌",
        requestStatus: (status) => `介面狀態 ${status}`, taskMedia: (index) => `任務媒體 ${index}`,
        resultScreenshot: (index) => `結果截圖 ${index}`, stageScreenshot: (stage) => `${stage} 截圖`, noMedia: "暫無媒體或截圖",
        taskId: "任務 ID", platform: "平台", task: "任務", status: "狀態", accountId: "帳號 ID", personaId: "人設 ID",
        createdAt: "建立時間", updatedAt: "更新時間", startedAt: "開始時間", finishedAt: "結束時間", error: "錯誤",
        openScreenshot: "開啟截圖", noLogs: "暫無日誌", missingTaskId: "缺少 task_id",
      },
    };
    function logLanguage() {
      try { return localStorage.getItem(LOG_LANGUAGE_STORAGE_KEY) === "zh-Hant" ? "zh-Hant" : "zh-Hans"; }
      catch { return "zh-Hans"; }
    }
    function logText(key, ...args) {
      const value = LOG_COPY[logLanguage()][key] ?? LOG_COPY["zh-Hans"][key] ?? key;
      return typeof value === "function" ? value(...args) : value;
    }
    function applyLogLanguage() {
      const language = logLanguage();
      document.documentElement.lang = language;
      document.documentElement.dataset.language = language;
      document.title = logText("documentTitle");
      document.querySelectorAll("[data-log-i18n]").forEach((node) => { node.textContent = logText(node.dataset.logI18n); });
      document.getElementById("toggleAutoBtn").textContent = logText(autoRefresh ? "pauseAuto" : "resumeAuto");
    }
    const params = new URLSearchParams(location.search);
    const taskId = params.get("task_id") || "";
    const storedAdminConsole = (() => {
      try { return sessionStorage.getItem("vecto-admin-console-context") === "1"; } catch { return false; }
    })();
    const explicitAdminMarker = params.get("admin_console") === "1";
    const requestedWorkspaceUserId = String(
      params.get("admin_workspace_user_id") || params.get("manage_user_id") || "",
    ).trim();
    const adminConsole = explicitAdminMarker || Boolean(requestedWorkspaceUserId) || storedAdminConsole;
    const adminWorkspaceUserId = requestedWorkspaceUserId
      || (!explicitAdminMarker && adminConsole ? String((() => {
        try { return sessionStorage.getItem("vecto-admin-workspace-user-id") || ""; } catch { return ""; }
      })()).trim() : "");
    try {
      if (adminConsole) sessionStorage.setItem("vecto-admin-console-context", "1");
      if (requestedWorkspaceUserId) sessionStorage.setItem("vecto-admin-workspace-user-id", requestedWorkspaceUserId);
      else if (explicitAdminMarker) sessionStorage.removeItem("vecto-admin-workspace-user-id");
    } catch {}
    let autoRefresh = true;
    let timer = 0;

    function contextualUrl(value) {
      const text = String(value || "").trim();
      if (!adminConsole || !text.startsWith("/")) return text;
      const url = new URL(text, location.origin);
      url.searchParams.set("admin_console", "1");
      if (adminWorkspaceUserId) {
        url.searchParams.set("admin_workspace_user_id", adminWorkspaceUserId);
      }
      return `${url.pathname}${url.search}${url.hash}`;
    }

    if (adminConsole) {
      const returnParams = new URLSearchParams();
      if (adminWorkspaceUserId) returnParams.set("manage_user_id", adminWorkspaceUserId);
      document.getElementById("returnConsole").href = `/admin-console.html${returnParams.size ? `?${returnParams}` : ""}`;
    }

    function esc(value) {
      return String(value == null ? "" : value).replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
      }[ch] || ch));
    }
    const AUTOMATION_LOG_TIME_ZONE = "Asia/Shanghai";
    function fmtTime(seconds) {
      const n = Number(seconds || 0);
      if (!n) return "-";
      return new Date(n * 1000).toLocaleString(logLanguage() === "zh-Hant" ? "zh-Hant" : "zh-CN", {
        timeZone: AUTOMATION_LOG_TIME_ZONE,
        hour12: false,
      });
    }
    async function api(path) {
      const headers = new Headers();
      if (adminConsole) {
        headers.set("X-Admin-Console", "1");
        if (adminWorkspaceUserId) headers.set("X-Admin-Workspace-User-ID", adminWorkspaceUserId);
      }
      const res = await fetch(path, { cache: "no-store", credentials: "include", headers });
      const text = await res.text();
      let data = null;
      try { data = text ? JSON.parse(text) : null; } catch { data = { detail: text }; }
      if (!res.ok) throw new Error((data && data.detail) || logText("requestStatus", res.status));
      return data;
    }
    function screenshotUrl(path) {
      const name = String(path || "").split(/[\\/]/).pop();
      return name ? contextualUrl(`/api/persona_dashboard/automation/screenshots/${encodeURIComponent(name)}`) : "";
    }
    function mediaType(path) {
      const text = String(path || "").toLowerCase();
      if (/\.(png|jpe?g|webp|gif|bmp)$/.test(text)) return "image";
      if (/\.(mp4|mov|m4v|webm)$/.test(text)) return "video";
      return "file";
    }
    function isCheckpointScreenshot(row) {
      const stage = String((row && row.stage) || "");
      return new Set([
        "auto_login_start",
        "auto_login_form_filled",
        "login_verification_required",
        "login_invalid_credentials",
        "login_wait_timeout",
        "login_complete",
        "completion_node",
        "check_login",
        "browse_feed",
        "threads_warmup",
        "threads_auto_reply_done",
        "instagram_auto_reply_done",
        "publish_done",
        "comment_done",
        "reply_done",
        "like_done",
        "already_liked",
        "share_done",
        "failed",
      ]).has(stage);
    }
    function screenshotThumbnailUrl(url) {
      const value = String(url || "");
      if (!value.startsWith("/api/persona_dashboard/automation/screenshots/")) return value;
      return `${value}${value.includes("?") ? "&" : "?"}thumbnail=1`;
    }
    function renderMedia(task, logs) {
      const payload = task.payload || {};
      const result = task.result || {};
      const items = [];
      (payload.media_paths || []).forEach((path, index) => {
        items.push({ label: logText("taskMedia", index + 1), path, url: contextualUrl(`/api/persona_dashboard/automation/tasks/${encodeURIComponent(task.id)}/media/${index}`) });
      });
      [result.screenshot_path, ...(result.replyScreenshots || [])].filter(Boolean).forEach((path, index) => {
        items.push({ label: logText("resultScreenshot", index + 1), path, url: screenshotUrl(path) });
      });
      logs.forEach((row) => {
        if (row.screenshot_url && isCheckpointScreenshot(row)) items.push({ label: logText("stageScreenshot", row.stage), path: row.screenshot_path, url: contextualUrl(row.screenshot_url) });
      });
      const seen = new Set();
      const html = items.filter((item) => {
        const key = item.url || item.path;
        if (!key || seen.has(key)) return false;
        seen.add(key);
        return true;
      }).map((item) => {
        const type = mediaType(item.path || item.url);
        const preview = type === "image" ? `<img src="${esc(screenshotThumbnailUrl(item.url))}" alt="${esc(item.label)}" loading="lazy" />` : "";
        return `<a href="${esc(item.url)}" target="_blank" rel="noopener">${preview}<strong>${esc(item.label)}</strong><br><small>${esc(item.path || item.url)}</small></a>`;
      }).join("");
      document.getElementById("mediaBox").innerHTML = html || `<div class="small">${esc(logText("noMedia"))}</div>`;
    }
    function renderTask(task, logs) {
      document.getElementById("logSubtitle").textContent = `${task.platform || "-"} / ${task.task_type || "-"} / ${task.id || taskId}`;
      document.getElementById("taskMeta").innerHTML = [
        [logText("taskId"), task.id],
        [logText("platform"), task.platform],
        [logText("task"), task.task_type],
        [logText("status"), `<span class="log-status ${esc(task.status)}">${esc(task.status || "-")}</span>`],
        [logText("accountId"), task.account_id],
        [logText("personaId"), task.persona_id],
        [logText("createdAt"), fmtTime(task.created_at)],
        [logText("updatedAt"), fmtTime(task.updated_at)],
        [logText("startedAt"), fmtTime(task.started_at)],
        [logText("finishedAt"), fmtTime(task.finished_at)],
        [logText("error"), task.error || "-"],
      ].map(([k, v]) => `<span>${esc(k)}</span><strong>${typeof v === "string" && v.startsWith("<") ? v : esc(v)}</strong>`).join("");
      document.getElementById("payloadBox").textContent = JSON.stringify({ payload: task.payload || {}, result: task.result || {} }, null, 2);
      renderMedia(task, logs);
    }
    function renderLogs(logs) {
      const logList = document.getElementById("logList");
      const wasNearBottom = logList.scrollHeight - logList.scrollTop - logList.clientHeight < 48;
      const previousTop = logList.scrollTop;
      logList.innerHTML = logs.map((row) => `
        <div class="log-item">
          <div class="log-item-top"><span>${esc(fmtTime(row.created_at))}</span><span>${esc(row.level)} / ${esc(row.stage)}</span></div>
          <div class="log-message">${esc(row.message || "")}</div>
          ${row.data && Object.keys(row.data).length ? `<div class="log-pre" style="margin-top:8px">${esc(JSON.stringify(row.data, null, 2))}</div>` : ""}
          ${row.screenshot_url && isCheckpointScreenshot(row) ? `<p><a href="${esc(contextualUrl(row.screenshot_url))}" target="_blank" rel="noopener">${esc(logText("openScreenshot"))}</a></p>` : ""}
        </div>
      `).join("") || `<div class="small">${esc(logText("noLogs"))}</div>`;
      logList.scrollTop = wasNearBottom ? logList.scrollHeight : previousTop;
    }
    async function load() {
      if (!taskId) throw new Error(logText("missingTaskId"));
      const [taskResp, logResp] = await Promise.all([
        api(`/api/persona_dashboard/automation/tasks/${encodeURIComponent(taskId)}`),
        api(`/api/persona_dashboard/automation/tasks/${encodeURIComponent(taskId)}/logs`),
      ]);
      const task = taskResp.task || {};
      const logs = logResp.logs || [];
      renderTask(task, logs);
      renderLogs(logs);
    }
    async function tick() {
      try { await load(); } catch (err) { document.getElementById("logSubtitle").textContent = err.message || String(err); }
    }
    document.getElementById("refreshBtn").addEventListener("click", tick);
    document.getElementById("toggleAutoBtn").addEventListener("click", () => {
      autoRefresh = !autoRefresh;
      document.getElementById("toggleAutoBtn").textContent = logText(autoRefresh ? "pauseAuto" : "resumeAuto");
    });
    applyLogLanguage();
    window.addEventListener("storage", (event) => {
      if (event.key !== LOG_LANGUAGE_STORAGE_KEY) return;
      applyLogLanguage();
      tick();
    });
    tick();
    timer = window.setInterval(() => { if (autoRefresh) tick(); }, 3000);
  </script>
</body>
</html>
