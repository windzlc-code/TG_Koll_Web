<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>官方授权结果</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #f4f6f8; color: #102033; font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { display: grid; place-items: center; padding: 24px; }
    main { width: min(420px, 100%); padding: 24px 20px; border: 1px solid #d8dee6; border-radius: 16px; background: #fff; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 18px; }
    p { color: #5b6b7c; }
    button { min-height: 44px; margin-top: 16px; padding: 0 18px; border: 0; border-radius: 10px; background: #152433; color: #fff; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">授权处理中</h1>
    <p id="message">请返回原窗口查看结果。</p>
    <button type="button" id="closeBtn">关闭此窗口</button>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const status = String(params.get("bundle_auth") || "").trim().toLowerCase();
    const succeeded = status === "success";
    const message = String(params.get("bundle_message") || "").trim();
    document.getElementById("title").textContent = succeeded ? "官方授权已完成" : "官方授权未完成";
    document.getElementById("message").textContent = message || (succeeded
      ? "账号已保存。请关闭此窗口，返回原页面继续。"
      : "请关闭此窗口，返回原页面后重新授权。");
    const payload = {
      type: "vecto:bundle-authorization-result",
      status,
      platform: String(params.get("bundle_platform") || "threads"),
      message,
      accountId: String(params.get("bundle_account_id") || ""),
    };
    if (window.opener && !window.opener.closed) {
      try { window.opener.postMessage(payload, location.origin); } catch (_) {}
    }
    document.getElementById("closeBtn").addEventListener("click", () => window.close());
    if (succeeded) window.setTimeout(() => window.close(), 1200);
  </script>
</body>
</html>
