<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="admin-console-session" content="__ADMIN_CONSOLE_SESSION__" />
  <meta name="admin-workspace-user-id" content="__ADMIN_WORKSPACE_USER_ID__" />
  <title data-profile-i18n="pageTitle">个人资料 - Vecto</title>
  <link rel="stylesheet" href="/assets/opc/site-navigation.css?v=__SITE_NAVIGATION_CSS_VERSION__" />
  <link rel="stylesheet" href="/assets/profile.css?v=__PROFILE_CSS_VERSION__" />
  <script defer src="/assets/opc/site-navigation.js?v=__SITE_NAVIGATION_JS_VERSION__"></script>
  <script defer src="/assets/vendor/opencc-js/st-characters.js?v=1.4.1"></script>
  <script defer src="/assets/vendor/opencc-js/ts-characters.js?v=1.4.1"></script>
  <script defer src="/assets/vendor/opencc-js/ts-phrases.js?v=1.4.1"></script>
  <script defer src="/assets/profile.js?v=__PROFILE_JS_VERSION__"></script>
</head>
<body class="profile-page">
  <a class="site-skip-link" href="#main-content" data-profile-i18n="skipToMain">跳至主要内容</a>
  <header class="site-header" data-site-header data-site-page="profile" data-site-mode="authenticated" data-site-variant="solid"></header>

  <main id="main-content" class="profile-main">
    <section class="profile-heading">
      <div>
        <span class="profile-eyebrow" data-profile-i18n="accountProfile">账号资料</span>
        <h1 data-profile-i18n="personalProfile">个人资料</h1>
        <p data-profile-i18n="profileDescription">设置显示名称和头像。登录用户名及账号权限不会因此改变。</p>
      </div>
      <a id="profileBackLink" class="profile-back-link" href="/console.html">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg>
        <span data-profile-i18n="backToConsole">返回控制台</span>
      </a>
    </section>

    <section class="profile-workspace" aria-label="个人资料设置" data-profile-i18n-aria-label="profileSettings">
      <form id="profileForm" class="profile-form">
        <div class="profile-avatar-column">
          <span id="profileFormTitle" class="profile-section-label" data-profile-i18n="avatar">头像</span>
          <button id="profileAvatarButton" class="profile-avatar-picker" type="button" aria-label="上传新头像" aria-controls="profileAvatarFile" data-profile-i18n-aria-label="uploadAvatar">
            <span id="profileAvatarPreview" class="profile-avatar-preview" aria-hidden="true">V</span>
            <span class="profile-avatar-add" aria-hidden="true">
              <svg class="profile-avatar-icon-add" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"></path></svg>
              <svg class="profile-avatar-icon-replace" viewBox="0 0 24 24" hidden><path d="M4 8a7 7 0 0 1 12-3l2 2"></path><path d="M18 3v4h-4"></path><path d="M20 16a7 7 0 0 1-12 3l-2-2"></path><path d="M6 21v-4h4"></path></svg>
            </span>
          </button>
          <input id="profileAvatarFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif" hidden />
          <p data-profile-i18n="avatarHelp">点击头像右下角的加号上传，最大 512KB。</p>
          <div class="profile-account-grid" aria-label="只读账号信息" data-profile-i18n-aria-label="readonlyAccountInfo">
            <div>
              <span data-profile-i18n="loginUsername">登录用户名</span>
              <strong id="profileUsername">-</strong>
            </div>
            <div>
              <span data-profile-i18n="accountId">账号 ID</span>
              <strong id="profileAccountId">-</strong>
            </div>
            <div>
              <span data-profile-i18n="accountType">账号类型</span>
              <strong id="profileAccountRole">-</strong>
            </div>
            <div>
              <span data-profile-i18n="email">邮箱</span>
              <strong id="profileAccountEmail">-</strong>
            </div>
          </div>
        </div>

        <div class="profile-fields">
          <label class="profile-field" for="profileFullName">
            <span data-profile-i18n="displayName">显示名称</span>
            <input id="profileFullName" name="full_name" type="text" maxlength="80" autocomplete="name" placeholder="请输入显示名称" data-profile-i18n-placeholder="displayNamePlaceholder" />
            <small data-profile-i18n="displayNameHelp">显示在右上角账号信息中，不会修改登录用户名。</small>
          </label>


          <label class="profile-field" for="profileSignature">
            <span data-profile-i18n="signature">个性签名</span>
            <textarea id="profileSignature" name="profile_signature" maxlength="280" rows="3" placeholder="填写一句对外展示的个人签名" data-profile-i18n-placeholder="signaturePlaceholder"></textarea>
            <small data-profile-i18n="signatureHelp">最多 280 个字符，会显示在账号资料中。</small>
          </label>

          <div class="profile-contact-grid">
            <label class="profile-field profile-field--wide" for="profileTagInput">
              <span data-profile-i18n="personalTags">个人标签</span>
              <input id="profileTags" name="profile_tags" type="hidden" />
              <div class="profile-tag-editor">
                <div id="profileTagList" class="profile-tag-list" aria-label="已添加标签" data-profile-i18n-aria-label="addedTags"></div>
                <div class="profile-tag-entry">
                  <input id="profileTagInput" type="text" maxlength="18" placeholder="输入标签" data-profile-i18n-placeholder="tagsPlaceholder" />
                  <button id="profileTagAdd" type="button" aria-label="添加标签" data-profile-i18n-aria-label="addTag">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
                  </button>
                </div>
              </div>
              <small data-profile-i18n="tagsHelp">点击加号添加，最多展示 8 个标签。</small>
            </label>
            <label class="profile-field" for="profilePhone">
              <span data-profile-i18n="phone">手机号</span>
              <input id="profilePhone" name="phone" type="tel" maxlength="32" autocomplete="tel" placeholder="填写联系电话" data-profile-i18n-placeholder="phonePlaceholder" />
            </label>
            <label class="profile-field" for="profileEmail">
              <span data-profile-i18n="email">邮箱</span>
              <input id="profileEmail" name="email" type="email" maxlength="160" autocomplete="email" placeholder="name@example.com" />
            </label>
          </div>

          <div class="profile-actions">
            <button id="profileChangePassword" class="profile-password-action" type="button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="10" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v2"></path></svg>
              <span data-profile-i18n="changePassword">修改密码</span>
            </button>
            <button id="profileSave" class="profile-save" type="submit" data-profile-i18n="saveProfile">保存个人资料</button>
            <span id="profileStatus" class="profile-status" role="status" aria-live="polite"></span>
          </div>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
