<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>购买专属代理 IP - Vecto</title>
  <link rel="stylesheet" href="/assets/proxy-purchase.css?v=__PROXY_PURCHASE_CSS_VERSION__">
  <script defer src="/assets/proxy-purchase.js?v=__PROXY_PURCHASE_JS_VERSION__"></script>
</head>
<body>
  <main class="purchase-shell">
    <header class="purchase-brand" aria-label="Vecto 代理采购">
      <a href="/console.html" class="brand-link" aria-label="返回控制台">
        <img src="/assets/opc/vecto-logo-ui-icon.png?v=20260711" alt="" width="42" height="42">
        <span><strong>Vecto</strong><small>代理采购中心</small></span>
      </a>
      <a class="back-link" href="/console.html">返回控制台</a>
    </header>

    <section class="purchase-stage" aria-labelledby="purchaseTitle">
      <div class="purchase-intro">
        <span class="eyebrow">PRIVATE NETWORK</span>
        <h1 id="purchaseTitle">配置你的<br><em>专属代理 IP</em></h1>
        <p>无需离开 Vecto 完成采购。代理激活后会自动加入你的可选列表，供应商凭据不会暴露在浏览器中。</p>
        <div class="signal-line" aria-hidden="true"><i></i><i></i><i></i></div>
      </div>

      <section class="purchase-card" aria-label="代理购买设置">
        <div class="card-head">
          <div><span class="step">01</span><h2>购买设置</h2></div>
          <span id="providerState" class="provider-state">正在连接供应商</span>
        </div>

        <div id="pageAlert" class="page-alert" role="alert" aria-live="assertive" hidden></div>

        <section class="mapped-product" aria-label="供应商产品配置">
          <div class="mapped-product-title">
            <span>供应商映射产品</span>
            <strong id="productName">静态住宅代理 IP</strong>
          </div>
          <strong class="mapped-product-plan" id="productIpVersion">标准 IPv4</strong>
          <small>独享固定 IP，购买后自动加入你的代理列表。</small>
        </section>

        <form id="purchaseForm" novalidate>
          <label class="field">
            <span>代理地区</span>
            <select id="country" name="country" required disabled>
              <option value="">正在加载可售地区...</option>
            </select>
            <small>可购买地区与库存由供应商实时同步。</small>
          </label>

          <section class="city-disclosure" id="citySection">
            <button type="button" class="city-toggle" id="cityToggle" aria-expanded="false" disabled>
              <span class="city-plus" aria-hidden="true"></span>
              <span><strong>精确选择城市</strong><small>可选；不选择时由供应商按国家地区自动分配。</small></span>
            </button>
            <label class="field city-field" id="cityPanel" hidden>
              <span>城市（可选）</span>
              <select id="city" name="city" disabled>
                <option value="">请先选择代理地区</option>
              </select>
              <small>选择后将优先购买该城市当前可用的代理 IP。</small>
            </label>
          </section>

          <dl class="mapped-order-specs" aria-label="锁定订单参数">
            <div><dt>ISP</dt><dd id="productIsp">按地区自动匹配</dd></div>
            <div><dt>数量</dt><dd id="productQuantity">1 个</dd></div>
          </dl>

          <label class="renewal-row" for="autoRenew">
            <span><strong>自动续费</strong><small>到期前检查算力点余额，余额充足时自动续费；余额不足不会扣款。</small></span>
            <input id="autoRenew" name="autoRenew" type="checkbox">
            <i aria-hidden="true"></i>
          </label>

          <button id="buyButton" class="buy-button" type="submit" disabled>
            <span id="buyButtonText">确认购买</span>
          </button>
        </form>

        <section id="orderStatus" class="order-status" aria-live="polite" hidden>
          <span class="status-orbit" aria-hidden="true"></span>
          <div class="order-status-copy"><strong id="orderStatusTitle">订单已受理</strong><p id="orderStatusMessage"></p></div>
          <label id="orderRenewalControl" class="order-renewal-control" hidden><input id="orderRenewal" type="checkbox"><span>自动续费</span></label>
        </section>
      </section>
    </section>
  </main>
</body>
</html>
